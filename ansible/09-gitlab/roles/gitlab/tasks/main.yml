---
- name: Write Docker Compose file
  template:
    src: docker-compose.yml.j2
    dest: "{{ gitlab_home }}/docker-compose.yml"
    mode: "0640"
  notify: restart gitlab

- name: Pull GitLab image
  command: docker compose pull
  args:
    chdir: "{{ gitlab_home }}"
  changed_when: false

- name: Install GitLab systemd service
  copy:
    dest: /etc/systemd/system/gitlab.service
    mode: "0644"
    content: |
      [Unit]
      Description=GitLab CE
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory={{ gitlab_home }}
      ExecStart=/usr/bin/docker compose up -d
      ExecStop=/usr/bin/docker compose down
      TimeoutStartSec=600

      [Install]
      WantedBy=multi-user.target

- name: Enable and start GitLab service
  systemd:
    name: gitlab
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for GitLab HTTP port
  wait_for:
    host: 127.0.0.1
    port: 80
    state: started
    timeout: 600

- name: Wait for GitLab health endpoint
  uri:
    url: "{{ gitlab_health_url }}"
    method: GET
    status_code: 200
    return_content: false
  register: gitlab_health
  retries: 30
  delay: 10
  until: gitlab_health.status == 200
