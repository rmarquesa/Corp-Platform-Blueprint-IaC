---
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install required packages
  apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - openssh-client
    state: present

- name: Create GitLab data directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ gitlab_home }}"
    - "{{ gitlab_home }}/config"
    - "{{ gitlab_home }}/logs"
    - "{{ gitlab_home }}/data"
