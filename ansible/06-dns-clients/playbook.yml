---
- name: Configure all nodes to use internal CoreDNS resolver
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Ensure resolved.conf.d directory exists
      file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        mode: "0755"

    - name: Configure systemd-resolved to use internal DNS
      copy:
        dest: /etc/systemd/resolved.conf.d/internal.conf
        mode: "0644"
        content: |
          [Resolve]
          DNS=10.10.0.5
          FallbackDNS=1.1.1.1
          Domains=l3s.local
      notify: restart resolved

  handlers:
    - name: restart resolved
      systemd:
        name: systemd-resolved
        state: restarted
        daemon_reload: true
