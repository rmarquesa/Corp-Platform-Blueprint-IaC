---
- name: Create etcd group
  group:
    name: etcd
    system: true

- name: Create etcd user
  user:
    name: etcd
    group: etcd
    system: true
    shell: /sbin/nologin
    home: /var/lib/etcd
    create_home: true

- name: Check if etcd binary exists
  stat:
    path: /usr/local/bin/etcd
  register: etcd_binary

- name: Download etcd binary
  when: not etcd_binary.stat.exists
  block:
    - name: Download etcd archive
      get_url:
        url: "https://github.com/etcd-io/etcd/releases/download/v{{ etcd_version }}/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"
        dest: /tmp/etcd.tar.gz
        mode: "0644"

    - name: Extract etcd
      unarchive:
        src: /tmp/etcd.tar.gz
        dest: /tmp
        remote_src: true

    - name: Install etcd binaries
      copy:
        src: "/tmp/etcd-v{{ etcd_version }}-linux-amd64/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        mode: "0755"
        remote_src: true
      loop:
        - etcd
        - etcdctl

- name: Create etcd data directory
  file:
    path: /var/lib/etcd
    state: directory
    owner: etcd
    group: etcd
    mode: "0700"

- name: Create etcd config directory
  file:
    path: /etc/etcd
    state: directory
    mode: "0755"

# ── Cluster membership management ────────────────────────────────────────────

- name: Check if etcd cluster is already running
  command: >
    etcdctl endpoint health
    --endpoints=http://{{ etcd_nodes.values() | first }}:2379
  register: etcd_existing
  ignore_errors: true
  run_once: true
  changed_when: false

- name: Get current etcd member list
  command: >
    etcdctl member list --write-out=json
    --endpoints=http://{{ etcd_nodes.values() | first }}:2379
  register: etcd_members_raw
  when: etcd_existing.rc == 0
  run_once: true
  changed_when: false
  ignore_errors: true

- name: Remove obsolete members and add missing members
  shell: |
    set -e
    ENDPOINTS="http://{{ etcd_nodes.values() | first }}:2379"
    KNOWN="{{ etcd_nodes.keys() | join(' ') }}"

    python3 << 'EOF'
    import json, subprocess, os

    endpoints = os.environ.get('EP', 'http://{{ etcd_nodes.values() | first }}:2379')
    known = set("{{ etcd_nodes.keys() | join(' ') }}".split())
    nodes = { {% for k, v in etcd_nodes.items() %}"{{ k }}": "{{ v }}", {% endfor %} }

    raw = subprocess.run(
        ["etcdctl", "member", "list", "--write-out=json",
         "--endpoints", endpoints],
        capture_output=True, text=True)
    data = json.loads(raw.stdout)
    members = data.get("members", [])
    current_names = {m.get("name", "") for m in members}

    # Remove members no longer in etcd_nodes
    for m in members:
        name = m.get("name", "")
        mid = format(m["ID"], "x")
        if name and name not in known:
            print(f"Removing obsolete member: {name} ({mid})")
            subprocess.run(["etcdctl", "member", "remove", mid,
                            "--endpoints", endpoints], check=True)

    # Add members in etcd_nodes not yet in cluster
    for name, ip in nodes.items():
        if name not in current_names:
            print(f"Adding new member: {name} (http://{ip}:2380)")
            subprocess.run(["etcdctl", "member", "add", name,
                            f"--peer-urls=http://{ip}:2380",
                            "--endpoints", endpoints], check=True)
    EOF
  when: etcd_existing.rc == 0
  run_once: true
  changed_when: true
  ignore_errors: true

- name: Determine cluster state per node
  set_fact:
    etcd_cluster_state: >-
      {{ 'existing' if (etcd_existing.rc | default(1)) == 0 and
         inventory_hostname not in (etcd_members_raw.stdout | default('') | from_json).get('members', []) | map(attribute='name') | list
         else 'new' }}
  when: etcd_existing is defined

- name: Default cluster state for fresh installs
  set_fact:
    etcd_cluster_state: "new"
  when: etcd_existing is not defined or etcd_existing.rc != 0

# ── Write config and start ────────────────────────────────────────────────────

- name: Write etcd environment file
  template:
    src: etcd.env.j2
    dest: /etc/etcd/etcd.env
    owner: etcd
    group: etcd
    mode: "0640"
  notify: restart etcd

- name: Write etcd systemd unit
  copy:
    dest: /etc/systemd/system/etcd.service
    mode: "0644"
    content: |
      [Unit]
      Description=etcd key-value store
      After=network.target

      [Service]
      User=etcd
      Type=notify
      EnvironmentFile=/etc/etcd/etcd.env
      ExecStart=/usr/local/bin/etcd
      Restart=always
      RestartSec=5s
      LimitNOFILE=65536

      [Install]
      WantedBy=multi-user.target
  notify: restart etcd

- name: Enable and start etcd
  systemd:
    name: etcd
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for etcd cluster to be healthy
  command: >
    etcdctl endpoint health
    --endpoints={% for ip in etcd_nodes.values() %}http://{{ ip }}:2379{% if not loop.last %},{% endif %}{% endfor %}
  retries: 10
  delay: 5
  register: etcd_health
  until: etcd_health.rc == 0
  run_once: true
  changed_when: false
