---
- name: Common prerequisites on all nodes
  hosts: etcd
  become: true
  roles:
    - prereqs

- name: Deploy etcd cluster
  hosts: etcd
  become: true
  roles:
    - etcd

- name: Deploy PostgreSQL + Patroni
  hosts: patroni
  become: true
  roles:
    - postgresql
    - patroni
    - dns_callback

- name: Bootstrap pgBouncer auth schema in PostgreSQL
  hosts: patroni
  become: true
  roles:
    - pgbouncer_auth
