---
- name: Install prerequisites
  apt:
    name:
      - curl
      - ca-certificates
      - gnupg
    state: present
    update_cache: yes

- name: Add Tailscale GPG key
  apt_key:
    url: https://pkgs.tailscale.com/stable/debian/bookworm.gpg
    state: present

- name: Add Tailscale apt repository
  apt_repository:
    repo: "deb https://pkgs.tailscale.com/stable/debian bookworm main"
    filename: tailscale
    state: present

- name: Install Tailscale
  apt:
    name: tailscale
    state: present
    update_cache: yes

- name: Enable and start tailscaled
  systemd:
    name: tailscaled
    enabled: true
    state: started
    daemon_reload: true

- name: Check TUN device inside the container
  stat:
    path: /dev/net/tun
  register: tailscale_tun_device

- name: Fail when TUN device is missing
  fail:
    msg: >-
      /dev/net/tun is missing inside the tailscale LXC. On the Proxmox host, ensure
      /etc/pve/lxc/230.conf contains 'lxc.cgroup2.devices.allow: c 10:200 rwm' and
      'lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file', then reboot
      the LXC with 'pct reboot 230'.
  when: not tailscale_tun_device.stat.exists

- name: Wait for tailscaled to become active
  command: systemctl is-active tailscaled
  register: tailscaled_active
  retries: 10
  delay: 2
  until: tailscaled_active.rc == 0
  changed_when: false
  failed_when: false

- name: Collect tailscaled diagnostics when inactive
  shell: |
    set -o pipefail
    systemctl status tailscaled --no-pager || true
    journalctl -u tailscaled -n 80 --no-pager || true
  args:
    executable: /bin/bash
  register: tailscaled_diagnostics
  changed_when: false
  when: tailscaled_active.rc != 0

- name: Show tailscaled diagnostics when inactive
  debug:
    msg: "{{ tailscaled_diagnostics.stdout_lines }}"
  when: tailscaled_active.rc != 0

- name: Fail when tailscaled did not become active
  fail:
    msg: "tailscaled did not become active; see diagnostics above."
  when: tailscaled_active.rc != 0

- name: Enable IP forwarding (IPv4)
  sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    sysctl_set: yes
    reload: yes

- name: Enable IP forwarding (IPv6)
  sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    state: present
    sysctl_set: yes
    reload: yes

- name: Check Tailscale backend state
  command: tailscale status --json
  register: ts_status_raw
  failed_when: false
  changed_when: false

- name: Parse Tailscale backend state
  set_fact:
    ts_backend: "{{ (ts_status_raw.stdout | from_json).BackendState | default('NeedsLogin') }}"
  when: ts_status_raw.rc == 0 and ts_status_raw.stdout | length > 0

- name: Set backend to NeedsLogin when tailscaled is unreachable
  set_fact:
    ts_backend: "NeedsLogin"
  when: ts_status_raw.rc != 0 or ts_status_raw.stdout | length == 0

- name: Authenticate and connect Tailscale
  shell: >
    tailscale up
    --authkey="{{ tailscale_auth_key }}"
    --advertise-routes="{{ tailscale_subnet }}"
    --accept-routes
    --hostname="{{ tailscale_hostname }}"
    --ssh
  when: ts_backend != "Running"

- name: Refresh Tailscale flags (already authenticated)
  shell: >
    tailscale up
    --advertise-routes="{{ tailscale_subnet }}"
    --accept-routes
    --hostname="{{ tailscale_hostname }}"
    --ssh
  when: ts_backend == "Running"
  changed_when: false

- name: Check Tailscale status
  command: tailscale status
  register: ts_status
  changed_when: false

- name: Show Tailscale status
  debug:
    msg: "{{ ts_status.stdout_lines }}"
