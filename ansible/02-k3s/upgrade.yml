---
- name: Upgrade k3s servers
  hosts: k3s_cluster
  become: true
  serial: 1
  tasks:
    - name: Upgrade k3s to {{ k3s_version }}
      shell: |
        curl -sfL https://get.k3s.io | \
        INSTALL_K3S_VERSION="{{ k3s_version }}" \
        sh -s - server

    - name: Wait for k3s to be ready after upgrade
      wait_for:
        host: "{{ ansible_host }}"
        port: "{{ k3s_api_port }}"
        delay: 10
        timeout: 120

    - name: Wait for node to be Ready
      shell: k3s kubectl get node {{ inventory_hostname }} -o jsonpath='{.status.conditions[-1].type}'
      register: node_status
      until: node_status.stdout == "Ready"
      retries: 20
      delay: 10
