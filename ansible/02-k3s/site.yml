---
- name: Prerequisites
  hosts: k3s_cluster
  become: true
  gather_facts: true
  roles:
    - prereqs

- name: Bootstrap first k3s server
  hosts: k3s_first_server
  become: true
  roles:
    - k3s_first_server

- name: Join remaining k3s servers
  hosts: k3s_servers
  become: true
  serial: 1
  roles:
    - k3s_other_servers

- name: Apply manifests on first server
  hosts: k3s_first_server
  become: true
  roles:
    - k3s_manifests

- name: Join k3s worker nodes
  hosts: k3s_workers_infra:k3s_workers_app
  become: true
  roles:
    - k3s_worker

- name: Label and taint worker nodes
  hosts: k3s_first_server
  become: true
  roles:
    - k3s_node_labels
