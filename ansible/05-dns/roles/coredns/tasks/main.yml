---
- name: Install dependencies
  apt:
    name: [curl, ca-certificates]
    state: present
    update_cache: true

- name: Check if CoreDNS is installed
  stat:
    path: /usr/local/bin/coredns
  register: coredns_binary

- name: Download CoreDNS
  when: not coredns_binary.stat.exists
  get_url:
    url: "https://github.com/coredns/coredns/releases/download/v{{ coredns_version }}/coredns_{{ coredns_version }}_linux_amd64.tgz"
    dest: /tmp/coredns.tgz
    mode: "0644"

- name: Extract CoreDNS
  when: not coredns_binary.stat.exists
  shell: |
    set -e
    tar -xzf /tmp/coredns.tgz -C /tmp
    install -m 0755 /tmp/coredns /usr/local/bin/coredns
  changed_when: true

- name: Create CoreDNS config directory
  file:
    path: "{{ coredns_config_dir }}"
    state: directory
    mode: "0755"

- name: Write hosts file
  template:
    src: hosts.j2
    dest: "{{ coredns_config_dir }}/hosts"
    mode: "0644"
  notify: restart coredns

- name: Write Corefile
  template:
    src: Corefile.j2
    dest: "{{ coredns_config_dir }}/Corefile"
    mode: "0644"
  notify: restart coredns

- name: Write CoreDNS systemd unit
  copy:
    dest: /etc/systemd/system/coredns.service
    mode: "0644"
    content: |
      [Unit]
      Description=CoreDNS DNS Server
      After=network.target

      [Service]
      Type=simple
      User=root
      ExecStart=/usr/local/bin/coredns -conf {{ coredns_config_dir }}/Corefile
      Restart=on-failure
      RestartSec=5s
      LimitNOFILE=65536

      [Install]
      WantedBy=multi-user.target
  notify: restart coredns

- name: Enable and start CoreDNS
  systemd:
    name: coredns
    enabled: true
    state: started
    daemon_reload: true

- name: Set CoreDNS as local resolver
  copy:
    dest: /etc/resolv.conf
    content: |
      nameserver 127.0.0.1
      nameserver 1.1.1.1
      search l3s.local
    mode: "0644"
