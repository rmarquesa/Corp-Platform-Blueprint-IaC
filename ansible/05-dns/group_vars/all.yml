coredns_version: "1.12.1"
coredns_install_dir: /opt/coredns
coredns_config_dir: /etc/coredns

internal_domain: proxmox.local
internal_network: 10.10.0.0/24
upstream_dns:
  - 1.1.1.1
  - 8.8.8.8

# PostgreSQL floating VIP is published statically as postgres.proxmox.local in CoreDNS.
# Keep etcd endpoints here only if dynamic DNS records are reintroduced later.
coredns_etcd_endpoints:
  - http://10.10.0.20:2379
  - http://10.10.0.22:2379
  - http://10.10.0.24:2379

# All internal hosts — single source of truth for DNS
dns_hosts:
  # Infrastructure
  - ip: 10.10.0.5
    names:
      - dns.proxmox.local

  # Kubernetes masters
  - ip: 10.10.0.10
    names:
      - k8s-master-1.proxmox.local
  - ip: 10.10.0.11
    names:
      - k8s-master-2.proxmox.local
  - ip: 10.10.0.12
    names:
      - k8s-master-3.proxmox.local

  # Kubernetes infra workers
  - ip: 10.10.0.13
    names:
      - k8s-infra-1.proxmox.local
  - ip: 10.10.0.14
    names:
      - k8s-infra-2.proxmox.local
  - ip: 10.10.0.15
    names:
      - k8s-infra-3.proxmox.local

  # Kubernetes app workers
  - ip: 10.10.0.16
    names:
      - k8s-app-1.proxmox.local
  - ip: 10.10.0.17
    names:
      - k8s-app-2.proxmox.local

  # Kubernetes API VIP (kube-vip control-plane address)
  - ip: 10.10.0.100
    names:
      - k8s-api.proxmox.local

  # Kubernetes HTTP services exposed by Traefik LoadBalancer
  - ip: 10.10.0.200
    names:
      - argocd.proxmox.local
      - grafana.proxmox.local
      - keycloak.proxmox.local
      - longhorn.proxmox.local

  # PostgreSQL / Patroni nodes and floating VIP
  - ip: 10.10.0.20
    names:
      - db-1.proxmox.local
  - ip: 10.10.0.22
    names:
      - db-2.proxmox.local
  - ip: 10.10.0.24
    names:
      - db-3.proxmox.local
  - ip: 10.10.0.21
    names:
      - postgres.proxmox.local
      - postgres-vip.proxmox.local

  # Harbor registry
  - ip: 10.10.0.30
    names:
      - harbor.proxmox.local

  # Vault
  - ip: 10.10.0.31
    names:
      - vault.proxmox.local
