ansible_user: root

vault_version: "1.19.2"
vault_data_dir: /opt/vault/data
vault_config_dir: /etc/vault.d
vault_api_addr: "http://10.10.0.31:8200"
vault_cluster_addr: "http://10.10.0.31:8201"

# Disable mlock: required on LXC where mlock is not permitted in unprivileged containers
vault_disable_mlock: true

# Auto-unseal via Cloudflare Workers KV
# Set vault_auto_unseal: false to use manual unseal
vault_auto_unseal: false

# Cloudflare KMS (fill after Cloudflare Worker is set up)
# vault_cf_account_id: ""
# vault_cf_api_token: ""
# vault_cf_kv_namespace_id: ""
