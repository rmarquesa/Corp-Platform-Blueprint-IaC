---
- name: Install prerequisites
  apt:
    name:
      - curl
      - ca-certificates
      - gnupg
    state: present
    update_cache: yes

- name: Add Tailscale GPG key
  apt_key:
    url: https://pkgs.tailscale.com/stable/debian/bookworm.gpg
    state: present

- name: Add Tailscale apt repository
  apt_repository:
    repo: "deb https://pkgs.tailscale.com/stable/debian bookworm main"
    filename: tailscale
    state: present

- name: Install Tailscale
  apt:
    name: tailscale
    state: present
    update_cache: yes

- name: Enable and start tailscaled
  systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Enable IP forwarding (IPv4)
  sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    sysctl_set: yes
    reload: yes

- name: Enable IP forwarding (IPv6)
  sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    state: present
    sysctl_set: yes
    reload: yes

- name: Check Tailscale backend state
  command: tailscale status --json
  register: ts_status_raw
  failed_when: false
  changed_when: false

- name: Parse Tailscale backend state
  set_fact:
    ts_backend: "{{ (ts_status_raw.stdout | from_json).BackendState | default('NeedsLogin') }}"
  when: ts_status_raw.rc == 0 and ts_status_raw.stdout | length > 0

- name: Set backend to NeedsLogin when tailscaled is unreachable
  set_fact:
    ts_backend: "NeedsLogin"
  when: ts_status_raw.rc != 0 or ts_status_raw.stdout | length == 0

- name: Authenticate and connect Tailscale
  shell: >
    tailscale up
    --authkey="{{ tailscale_auth_key }}"
    --advertise-routes="{{ tailscale_subnet }}"
    --accept-routes
    --hostname="{{ tailscale_hostname }}"
    --ssh
  when: ts_backend != "Running"

- name: Refresh Tailscale flags (already authenticated)
  shell: >
    tailscale up
    --advertise-routes="{{ tailscale_subnet }}"
    --accept-routes
    --hostname="{{ tailscale_hostname }}"
    --ssh
  when: ts_backend == "Running"
  changed_when: false

- name: Check Tailscale status
  command: tailscale status
  register: ts_status
  changed_when: false

- name: Show Tailscale status
  debug:
    msg: "{{ ts_status.stdout_lines }}"
