traefik:
  deployment:
    replicas: 2

  nodeSelector:
    workload: infra

  tolerations:
    - key: workload
      operator: Equal
      value: infra
      effect: NoSchedule

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  service:
    type: LoadBalancer
    spec:
      # First IP from kube-vip LoadBalancer pool (10.10.0.200-10.10.0.250).
      # Internal DNS points platform HTTP hostnames at this address for Tailscale access.
      loadBalancerIP: 10.10.0.200

  ingressClass:
    enabled: true
    isDefaultClass: true

  providers:
    kubernetesIngress:
      enabled: true
    kubernetesCRD:
      enabled: true
    kubernetesGateway:
      enabled: true

  gateway:
    enabled: true
    name: traefik-gateway
    listeners:
      web:
        port: 80
        protocol: HTTP
        namespacePolicy:
          from: All

  ports:
    web:
      port: 80
      expose:
        default: true

  logs:
    general:
      level: INFO
    access:
      enabled: true
