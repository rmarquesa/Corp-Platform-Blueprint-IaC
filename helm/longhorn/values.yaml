longhorn:
  defaultSettings:
    defaultDataPath: /var/lib/longhorn
    defaultReplicaCount: 2
    storageMinimalAvailablePercentage: 15
    storageOverProvisioningPercentage: 150
    autoSalvage: true
    autoDeletePodWhenVolumeDetachedUnexpectedly: true
    nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
    taintToleration: "workload=infra:NoSchedule"

  persistence:
    defaultClass: true
    defaultClassReplicaCount: 2
    reclaimPolicy: Retain

  longhornManager:
    tolerations:
      - key: workload
        operator: Exists
        effect: NoSchedule
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  longhornDriver:
    tolerations:
      - key: workload
        operator: Exists
        effect: NoSchedule
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  longhornUI:
    nodeSelector:
      workload: infra
    tolerations:
      - key: workload
        operator: Equal
        value: infra
        effect: NoSchedule
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  ingress:
    enabled: false

  extraObjects:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: longhorn
        namespace: longhorn-system
      spec:
        parentRefs:
          - name: traefik-gateway
            namespace: traefik
            sectionName: web
        hostnames:
          - longhorn.proxmox.local
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: longhorn-frontend
                port: 80
