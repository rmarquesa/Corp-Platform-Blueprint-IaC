{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-vault-approle
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: vault-approle
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.clusterSecretStore | quote }}
  target:
    name: jenkins-vault-approle
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: vault-role-id
      remoteRef:
        key: {{ .Values.externalSecrets.paths.vaultApprole | quote }}
        property: role-id
    - secretKey: vault-secret-id
      remoteRef:
        key: {{ .Values.externalSecrets.paths.vaultApprole | quote }}
        property: secret-id
{{- end }}
