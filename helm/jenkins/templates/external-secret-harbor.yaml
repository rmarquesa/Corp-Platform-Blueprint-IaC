{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-harbor-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: harbor-credentials
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.clusterSecretStore | quote }}
  target:
    name: jenkins-harbor-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.externalSecrets.paths.harbor | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecrets.paths.harbor | quote }}
        property: password
{{- end }}
