# Kubernetes cloud configuration for ephemeral build agents.
# Jenkins URL and tunnel address use the in-cluster service DNS so agents
# can connect from any namespace without going through the Ingress.
jenkins:
  clouds:
    - kubernetes:
        name: "kubernetes"
        serverUrl: "https://kubernetes.default"
        namespace: "jenkins"
        jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
        jenkinsTunnel: "jenkins-agent.jenkins.svc.cluster.local:50000"
        containerCapStr: "10"
        connectTimeout: "5"
        readTimeout: "15"
        maxRequestsPerHostStr: "32"
        retentionTimeout: "5"
        waitForPodSec: "600"
        skipTlsVerify: false
        credentialsId: ""
        podLabels:
          - key: "jenkins/jenkins-agent"
            value: "true"
        templates:
          - name: "default"
            namespace: "jenkins"
            serviceAccount: "jenkins-agent"
            label: "jenkins-agent"
            nodeUsageMode: "NORMAL"
            idleMinutes: 0
            instanceCap: 2147483647
            podRetention: Never
            volumes:
              - hostPathVolume:
                  hostPath: "/var/run/docker.sock"
                  mountPath: "/var/run/docker.sock"
            containers:
              - name: "jnlp"
                image: "jenkins/inbound-agent:latest"
                alwaysPullImage: false
                workingDir: "/home/jenkins/agent"
                ttyEnabled: false
                resourceRequestCpu: "200m"
                resourceRequestMemory: "512Mi"
                resourceLimitCpu: "1000m"
                resourceLimitMemory: "1Gi"
