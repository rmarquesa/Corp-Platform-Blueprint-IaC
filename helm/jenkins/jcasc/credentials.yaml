# Declares global credentials injected from Vault via ExternalSecrets.
# - git-credentials: username/password used by pipelines to clone repositories.
# - vault-approle-placeholder: AppRole credential used by the Vault plugin to
#   fetch secrets at pipeline runtime.
credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "git-credentials"
              description: "Git credentials sourced from Vault via ExternalSecrets"
              username: "${jenkins-git-credentials-git-username}"
              password: "${jenkins-git-credentials-git-password}"
          - vaultAppRoleCredential:
              scope: GLOBAL
              id: "vault-approle-placeholder"
              description: "Vault AppRole credential placeholder"
              path: "approle"
              roleId: "${jenkins-vault-approle-vault-role-id}"
              secretId: "${jenkins-vault-approle-vault-secret-id}"
