# Wrapper chart values for Jenkins (JCasC-driven, Kubernetes agents, Vault).
#
# All admin credentials, Git credentials and Vault AppRole secrets are
# materialised through ExternalSecrets (see templates/external-secret-*.yaml).
# No real secrets are ever committed to this file.
#
# Upstream chart: https://charts.jenkins.io (jenkins 5.9.18)
# Values below are passed through under the `jenkins:` key matching the
# dependency alias declared in Chart.yaml.

# ---------------------------------------------------------------------------
# ExternalSecrets toggle for this wrapper chart's templates.
# When true, three ExternalSecret manifests are rendered, all pointing to the
# cluster-wide ClusterSecretStore named `vault` provisioned by external-secrets.
# ---------------------------------------------------------------------------
externalSecrets:
  enabled: true
  # ClusterSecretStore name (already exists in the cluster).
  clusterSecretStore: vault
  # Vault KV v2 paths (relative to the `kv/` mount configured in ClusterSecretStore/vault).
  paths:
    admin: jenkins/admin
    git: jenkins/git
    vaultApprole: jenkins/vault-approle
  # Refresh interval for ESO reconciliation.
  refreshInterval: 1h

# ---------------------------------------------------------------------------
# Upstream Jenkins chart values, namespaced under the dependency alias.
# ---------------------------------------------------------------------------
jenkins:
  # Controller (formerly "master") configuration.
  controller:
    # Public hostname used by the Ingress and JCasC URL settings.
    jenkinsUrl: "http://jenkins.proxmox.local"
    jenkinsUriPrefix: ""

    # Enforce Jenkins UI Content-Security-Policy at JVM level. This keeps CSP
    # controlled by Helm and prevents disabling/changing it through the UI.
    javaOpts: >-
      -Djenkins.security.csp.CspHeader.headerName=Content-Security-Policy
      -Djenkins.security.csp.CspHeader.value="sandbox; default-src 'none';
      img-src 'self' data:; style-src 'self' 'unsafe-inline';
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      font-src 'self'; connect-src 'self'; form-action 'self';"

    # -- Number of replicas. Max 1. Can be set to 0 for maintenance scenarios.
    replicas: 1

    # StatefulSet update strategy — RollingUpdate replaces the pod in place.
    updateStrategy:
      type: RollingUpdate

    # Expose the admin credentials as env vars so the preStop hook can
    # authenticate against the secured Jenkins API.
    containerEnv:
      - name: JENKINS_ADMIN_USER
        valueFrom:
          secretKeyRef:
            name: jenkins-admin-secret
            key: jenkins-admin-user
      - name: JENKINS_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: jenkins-admin-secret
            key: jenkins-admin-password

    # Safe-restart on helm upgrade:
    #   1. Obtain a CSRF crumb (required by DefaultCrumbIssuer).
    #   2. PUT Jenkins into quiet mode so no new builds are accepted.
    #   3. Poll every 10 s until every executor (local + one-off pipeline) is idle.
    # terminationGracePeriodSeconds gives the outer deadline (1 h).
    # Without authentication the curl returns a 403, grep matches nothing,
    # wc -l returns 0, and the pod terminates instantly — hence the fix.
    terminationGracePeriodSeconds: 3600
    lifecycle:
      preStop:
        exec:
          command:
            - sh
            - -c
            - |
              AUTH="${JENKINS_ADMIN_USER}:${JENKINS_ADMIN_PASSWORD}"
              BASE="http://localhost:8080"
              CRUMB=$(curl -sf -u "${AUTH}" "${BASE}/crumbIssuer/api/json" \
                | grep -o '"crumb":"[^"]*"' | cut -d'"' -f4)
              curl -sf -X POST -u "${AUTH}" -H "Jenkins-Crumb: ${CRUMB}" \
                "${BASE}/quietDown" || true
              until [ "$(curl -sf -u "${AUTH}" \
                "${BASE}/computer/api/json?tree=computer[executors[idle],oneOffExecutors[idle]]" \
                | grep -o '"idle":false' | wc -l)" = "0" ]; do
                sleep 10
              done

    # PDB disabled: with replicas: 1, minAvailable: 1 blocks every node drain.
    # Graceful shutdown is handled by terminationGracePeriodSeconds above.
    podDisruptionBudget:
      enabled: false

    # Resources for the controller pod.
    resources:
      requests:
        cpu: "200m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"

    # We supply the admin credential via an ExternalSecret. The upstream chart
    # consumes it through controller.admin.existingSecret and exposes the values
    # to JCasC as ${chart-admin-username} and ${chart-admin-password}.
    admin:
      createSecret: true
      existingSecret: "jenkins-admin-secret"
      userKey: jenkins-admin-user
      passwordKey: jenkins-admin-password

    # Additional ExternalSecret-backed Kubernetes Secrets mounted for JCasC
    # interpolation from /run/secrets/additional.
    additionalExistingSecrets:
      - name: jenkins-git-credentials
        keyName: git-username
      - name: jenkins-git-credentials
        keyName: git-password
      - name: jenkins-vault-approle
        keyName: vault-role-id
      - name: jenkins-vault-approle
        keyName: vault-secret-id

    # Ingress (Traefik). TLS disabled for internal cluster access.
    ingress:
      enabled: true
      apiVersion: "networking.k8s.io/v1"
      ingressClassName: "traefik"
      hostName: "jenkins.proxmox.local"
      tls: []
      annotations: {}

    # Primary plugins — only the ones explicitly chosen for this platform.
    # Transitive dependencies are resolved automatically by the plugin manager
    # at install time; there is no need to list them here.
    # To regenerate a fully-pinned closure (e.g. after a Jenkins upgrade):
    #   java -jar jenkins-plugin-manager.jar --war jenkins.war \
    #     --plugin-file <(helm template . | grep '^\s*-' | ...) --output yaml
    installPlugins:
      # --- Configuration & Security ---
      - antisamy-markup-formatter:173.v680e3a_b_69ff3
      - configuration-as-code:2077.v41f1011a_5110
      - credentials:1502.v5c95e620ddfe
      - credentials-binding:720.v3f6decef43ea_
      - matrix-auth:3.2.10
      - role-strategy:848.va_a_ea_673cf0b_c
      - script-security:1402.v94c9ce464861
      - ssh-credentials:372.va_250881b_08cd

      # --- Source Control ---
      - git:5.10.1
      - github:1.46.0.1

      # --- Pipelines ---
      - pipeline-model-definition:2.2277.v00573e73ddf1
      - pipeline-rest-api:2.41
      - pipeline-stage-view:2.41
      - workflow-aggregator:608.v67378e9d3db_1
      - workflow-multibranch:821.vc3b_4ea_780798
      - job-dsl:3654.vdf58f53e2d15

      # --- Kubernetes Agents ---
      - kubernetes:4423.vb_59f230b_ce53
      - kubernetes-credentials:207.v492f58828b_ed
      - docker-plugin:1316.v75635a_002b_0a_

      # --- Integrations ---
      - hashicorp-vault-plugin:379.v080d932e61e4
      - sonar:2.18.2
      - snyk-security-scanner:5.0.1

      # --- Notifications & UI ---
      - email-ext:1933.v45cec755423f
      - mailer:534.v1b_36f5864073
      - junit:1403.vd9d1413fd205
      - favorite:2.263.v941d21defef7
      - matrix-project:870.v9db_fcfc2f45b_


    # installLatestPlugins: false  → respects the :version pins in installPlugins.
    #   The plugin manager compares checksums against what is already on the PVC;
    #   it only downloads a plugin if the pinned version differs from what is
    #   installed. This keeps restarts fast (~30 s JVM + JCasC vs 3-5 min with
    #   installLatestPlugins: true which re-downloads everything on every start).
    #
    # To update a plugin: bump its version in installPlugins and run helm upgrade.
    # Transitive dependencies are resolved to the minimum compatible version.
    installLatestPlugins: false
    installLatestSpecifiedPlugins: false
    overwritePlugins: true

    # Resources for the config-reload sidecar (required by ResourceQuota).
    # The chart nests this under controller.sidecars.configAutoReload.
    sidecars:
      configAutoReload:
        enabled: true
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"

    # ----------------------------------------------------------------------
    # JCasC: scripts are loaded from jcasc/*.yaml via configmap-jcasc.yaml.
    # ----------------------------------------------------------------------
    JCasC:
      defaultConfig: false
      configScripts: {}
      # Disable built-in securityRealm and authorizationStrategy snippets —
      # both are fully managed in jcasc/security.yaml.
      securityRealm: ""
      authorizationStrategy: ""

    # ----------------------------------------------------------------------
    # initScripts: Groovy executed on controller boot, BEFORE JCasC runs.
    # Scripts are loaded from init-scripts/*.groovy via configmap-init-scripts.yaml.
    # ----------------------------------------------------------------------
    initScripts: {}

  # ----------------------------------------------------------------------
  # Persistence for ${JENKINS_HOME}.
  # ----------------------------------------------------------------------
  persistence:
    enabled: true
    storageClass: longhorn
    size: "10Gi"

  # ----------------------------------------------------------------------
  # Agents (ephemeral Kubernetes pods via the kubernetes plugin).
  # ----------------------------------------------------------------------
  agent:
    enabled: true
    namespace: "jenkins"
    connectTimeout: 100
    containerCap: 10
    defaultsProviderTemplate: ""
    image:
      repository: "jenkins/inbound-agent"
      tag: "latest"
    resources:
      requests:
        cpu: "200m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
    podTemplates:
      default: |
        - name: default
          label: default
          serviceAccount: jenkins-agent
          volumes:
            - hostPathVolume:
                hostPath: "/var/run/docker.sock"
                mountPath: "/var/run/docker.sock"
          containers:
            - name: jnlp
              image: jenkins/inbound-agent:latest
              resourceRequestCpu: "200m"
              resourceRequestMemory: "512Mi"
              resourceLimitCpu: "1000m"
              resourceLimitMemory: "1Gi"

  # Place the release into the `jenkins` namespace via Helm `--namespace`.
  # The chart itself does not create the namespace; ArgoCD or the operator
  # invoking `helm upgrade --install` is responsible.
  rbac:
    create: true
  serviceAccount:
    create: true
    name: jenkins
  serviceAccountAgent:
    create: true
    name: jenkins-agent
