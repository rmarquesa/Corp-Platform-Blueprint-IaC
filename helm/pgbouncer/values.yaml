replicaCount: 2

image:
  repository: harbor.proxmox.local/platform/pgbouncer
  tag: "1.24.0-alpine3.22"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""

config:
  databases:
    "*":
      host: postgres.proxmox.local
      port: 5432

  pgbouncer:
    listen_port: 5432
    listen_addr: "*"
    auth_type: scram-sha-256
    auth_file: /etc/pgbouncer/userlist.txt
    auth_user: pgbouncer
    auth_query: "SELECT username, password FROM pgbouncer.get_auth($1)"
    pool_mode: transaction
    max_client_conn: 200
    default_pool_size: 20
    min_pool_size: 5
    reserve_pool_size: 5
    reserve_pool_timeout: 3
    server_idle_timeout: 600
    server_connect_timeout: 5
    server_login_retry: 3
    client_idle_timeout: 0
    log_connections: 0
    log_disconnections: 0
    log_pooler_errors: 1
    server_tls_sslmode: disable

# Secrets policy:
# Real userlist.txt MUST be provisioned out-of-band (e.g. Vault agent injector,
# external-secrets, sealed-secrets) and referenced via existingSecret.
# createPlaceholder=false (default) means no Secret is rendered by this chart.
# Setting createPlaceholder=true emits a clearly-fake placeholder Secret only
# so a fresh cluster can boot before the real Secret is materialized; pgBouncer
# will reject real auth attempts until the real Secret replaces it.
userList:
  existingSecret: pgbouncer-userlist
  createPlaceholder: false

# External Secrets Operator integration. When enabled, an ExternalSecret syncs
# the userlist.txt entry from the configured ClusterSecretStore (Vault) into
# the Kubernetes Secret named by userList.existingSecret.
externalSecrets:
  enabled: true
  clusterSecretStore: vault
  refreshInterval: 1h
  userList:
    remoteKey: pgbouncer/userlist
    property: userlist.txt

service:
  type: ClusterIP
  port: 5432

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

nodeSelector:
  workload: infra

tolerations:
  - key: workload
    operator: Equal
    value: infra
    effect: NoSchedule

podDisruptionBudget:
  enabled: true
  minAvailable: 1

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1100
  runAsGroup: 1100
  fsGroup: 1100

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
