argo-cd:
  global:
    domain: argocd.proxmox.local
    nodeSelector:
      workload: infra
    tolerations:
      - key: workload
        operator: Equal
        value: infra
        effect: NoSchedule

  configs:
    params:
      server.insecure: "true"
    secret:
      # Let the chart create the baseline argocd-secret; Argo CD populates
      # runtime data (e.g. server signing key) into it at startup.
      createSecret: true
    rbac:
      policy.default: role:readonly
    repositories:
      grafana:
        url: https://grafana.github.io/helm-charts
        name: grafana
        type: helm
      prometheus-community:
        url: https://prometheus-community.github.io/helm-charts
        name: prometheus-community
        type: helm
      bitnami:
        url: https://charts.bitnami.com/bitnami
        name: bitnami
        type: helm
      edoburu:
        url: https://edoburu.github.io/helm-charts
        name: edoburu
        type: helm

  server:
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    service:
      type: ClusterIP
    ingress:
      enabled: false

  dex:
    enabled: false

  redis:
    enabled: false

  redis-ha:
    enabled: true
    persistentVolume:
      enabled: true
      storageClass: longhorn
      size: 5Gi
    nodeSelector:
      workload: infra
    tolerations:
      - key: workload
        operator: Equal
        value: infra
        effect: NoSchedule

  extraObjects:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: argocd-http
        namespace: argocd
      spec:
        parentRefs:
          - name: traefik-gateway
            namespace: traefik
            sectionName: web
        hostnames:
          - argocd.proxmox.local
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: argocd-server
                port: 80

  controller:
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

  repoServer:
    replicas: 2
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

  applicationSet:
    replicas: 2
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
